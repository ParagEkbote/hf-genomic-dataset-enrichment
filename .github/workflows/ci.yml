name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: carbon-enrichment

env:
  UV_PYTHON: "3.12"
  PRE_COMMIT_HOME: ${{ github.workspace }}/.cache/pre-commit

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            carbon-enrichment/pyproject.toml

      - name: Install dev tools
        run: uv sync --extra dev

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: .cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('carbon-enrichment/.pre-commit-config.yaml') }}

      - name: Run pre-commit checks (warning only)
        continue-on-error: true
        run: uv run pre-commit run --all-files

      - name: Check Python lint
        run: uv run ruff check --output-format=github .

      - name: Check Python formatting
        run: uv run ruff format --check .

  validation:
    name: Project validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            carbon-enrichment/pyproject.toml

      - name: Install project
        run: uv sync --extra dev

      - name: Compile Python sources
        run: uv run python -m compileall -q carbon_enrichment

      - name: Validate YAML configuration
        run: uv run python -m carbon_enrichment.validation.config

      - name: Load Dagster definitions
        run: uv run python -c "import carbon_enrichment.definitions"
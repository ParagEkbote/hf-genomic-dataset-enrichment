# config/dev-gpu.yaml

ops:
  carbon_gpu_enrichment:
    config:
      # Tokenized corpus is already produced.
      tokenized_output_dir: ".dagster_hf_storage/carbon_tokenized_corpus_sample_300m"

      # GPU enrichment outputs
      embeddings_output_dir: ".dagster_hf_storage/carbon_embeddings"
      likelihood_output_dir: ".dagster_hf_storage/carbon_likelihood_stats"

      # GPU processing
      batch_size: 150
      rows_per_shard: 250000
      gpu_token_budget: 20000000

      # Storage
      compression: "zstd"
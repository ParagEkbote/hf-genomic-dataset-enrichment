ops:
  carbon_pilot_corpus:
    config:
      validation_level: "dev"

      cpu_enriched_input_type: "hub"
      cpu_enriched_dataset: "AINovice2005/carbon-cpu-enriched-sequences"

      pilot_output_dir: ".dagster_hf_storage/carbon_pilot_corpus"

      batch_size: 256
      rows_per_shard: 5000
      compression: "zstd"
      streaming: true

  carbon_tokenized_corpus:
    config:
      pilot_output_dir: ".dagster_hf_storage/carbon_pilot_corpus"
      tokenized_output_dir: ".dagster_hf_storage/carbon_tokenized_corpus"
      batch_size: 256
      rows_per_shard: 5000
      compression: "zstd"
      cpu_workers: 4

  carbon_gpu_enrichment:
    config:
      tokenized_output_dir: ".dagster_hf_storage/carbon_tokenized_corpus"
      batch_size: 128
      rows_per_shard: 5000
      compression: "zstd"

  carbon_likelihood_summary:
    config:
      tokenized_output_dir: ".dagster_hf_storage/carbon_tokenized_corpus"

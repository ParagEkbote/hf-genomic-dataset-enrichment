# config/dev-gpu.yaml

validation_level: integration

streaming: true

# Tokenized corpus is already produced.
tokenized_output_dir: ".dagster_hf_storage/carbon_tokenized_corpus"

# GPU enrichment outputs
embeddings_output_dir: ".dagster_hf_storage/carbon_embeddings"
likelihood_output_dir: ".dagster_hf_storage/carbon_likelihood_stats"

# GPU processing
batch_size: 1000
rows_per_shard: 250000
gpu_token_budget: 100000000

# Storage
compression: "zstd"

# Not relevant to GPU inference, but retained for config completeness
enable_progress: true
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
    container_name: carbon-elasticsearch
    restart: unless-stopped

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false

      # Start conservatively for the 100k validation run.
      # Increase for the full 32M-row corpus.
      - ES_JAVA_OPTS=-Xms2g -Xmx2g

      # Avoid unnecessary disk watermark behavior during local benchmarking.
      - cluster.routing.allocation.disk.watermark.low=85%
      - cluster.routing.allocation.disk.watermark.high=90%
      - cluster.routing.allocation.disk.watermark.flood_stage=95%

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    ulimits:
      memlock:
        soft: -1
        hard: -1

  qdrant:
    image: qdrant/qdrant:v1.15.5
    container_name: carbon-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:6333/healthz || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  elasticsearch_data:
    name: carbon-elasticsearch-data

  qdrant_data:
    name: carbon-qdrant-data
services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    container_name: carbon-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:6333/healthz || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  qdrant_data:
    name: carbon-qdrant-data